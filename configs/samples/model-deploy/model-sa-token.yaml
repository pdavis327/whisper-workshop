# ServiceAccount, token Secret, and RBAC so a client can read this InferenceService.
# Names match inferenceservice.yaml. Namespace: whisper-workshop.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whisper-large-v3-sa
  namespace: whisper-workshop
---
apiVersion: v1
kind: Secret
metadata:
  name: whisper-large-v3-sa
  namespace: whisper-workshop
  annotations:
    kubernetes.io/service-account.name: whisper-large-v3-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whisper-large-v3-sa-role
  namespace: whisper-workshop
  labels:
    opendatahub.io/dashboard: "true"
rules:
  - apiGroups:
      - serving.kserve.io
    resources:
      - inferenceservices
    resourceNames:
      - whisper-large-v3
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whisper-large-v3-sa-rolebinding
  namespace: whisper-workshop
  labels:
    opendatahub.io/dashboard: "true"
subjects:
  - kind: ServiceAccount
    name: whisper-large-v3-sa
    namespace: whisper-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: whisper-large-v3-sa-role

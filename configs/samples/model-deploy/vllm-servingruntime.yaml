# vLLM ServingRuntime for Whisper large-v3 (namespace: whisper-workshop).
#
# Copy the container image from YOUR cluster before first apply:
#   oc -n redhat-ods-applications get servingruntime \
#     -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[0].image
# Pick the vLLM NVIDIA GPU runtime template image and paste it below.
#
# Do not set --task transcription — that can disable /v1/audio/translations.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/serving-runtime-scope: global
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/template-name: vllm-cuda-runtime-template
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for Whisper
  labels:
    opendatahub.io/dashboard: "true"
  name: whisper-large-v3
  namespace: whisper-workshop
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
  - args:
    - --port=8080
    - --model=/mnt/models
    - --served-model-name=whisper-large-v3
    - --max-model-len
    - "448"
    - --gpu-memory-utilization
    - "0.90"
    - --max-num-seqs
    - "8"
    command:
    - python
    - -m
    - vllm.entrypoints.openai.api_server
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    image: quay.io/modh/vllm:rhoai-3.4-cuda
    name: kserve-container
    ports:
    - containerPort: 8080
      protocol: TCP
  multiModel: false
  supportedModelFormats:
  - autoSelect: true
    name: vLLM
